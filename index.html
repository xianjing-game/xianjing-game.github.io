<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>仙境苍穹·单机版（凡人篇 MVP）</title>
<style>
:root{--paper:#e9e6df;--ink:#232323;--dim:#77736a;--accent:#c9962e;--parch:#f4ecda;--parch2:#e7dbbe;--pb:#a88d62;--good:#2e7d3a;--bad:#b23a2a;--rare:#7d3fc4;--chat:#2f6a8a;--trib:#8a6200;--gold:#e8c27a;
--kai:"STKaiti","KaiTi","Kaiti SC","楷体","Noto Serif CJK SC","Songti SC",serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#bdb8ad;color:var(--ink);font:14px/1.45 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;overscroll-behavior:none;user-select:none}
button{font:inherit;cursor:pointer}
svg.ic{width:1em;height:1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.25)}
/* ---- 场景 ---- */
#sceneWrap{position:relative;flex:1 1 auto;min-height:300px;background:#ddd;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#top{position:absolute;top:0;left:0;right:0;z-index:4;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 8px 0;pointer-events:none}
.brush{background:linear-gradient(90deg,rgba(18,18,18,.94),rgba(18,18,18,.82) 70%,rgba(18,18,18,0));color:#f3efe6;padding:3px 36px 5px 12px;clip-path:polygon(0 14%,3% 2%,60% 0,94% 8%,100% 45%,95% 100%,40% 94%,2% 100%);pointer-events:auto}
.brush .nm{font:600 17px var(--kai);letter-spacing:1px}
.brush .lv{font-size:11.5px;color:#e9a77a}
.res{display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:auto}
.res .row{display:flex;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(rgba(30,30,30,.78),rgba(10,10,10,.78));color:#f4efe2;border-radius:12px;padding:1px 9px 1px 3px;font-size:12.5px;white-space:nowrap;border:1px solid rgba(232,194,122,.45)}
.chip .gi{width:18px;height:18px;display:inline-flex}
.chip:empty{display:none}
.side{position:absolute;top:96px;z-index:3;display:flex;flex-direction:column;gap:10px;transition:opacity .25s,transform .25s}
#sideL{left:8px}#sideR{right:8px}
.view-field .side{opacity:0;pointer-events:none;transform:translateY(-10px)}
.sbtn{position:relative;width:52px;height:52px;border:none;padding:0;border-radius:47% 53% 45% 55%/55% 45% 53% 47%;background:radial-gradient(circle at 42% 36%,#4a4a4a 0,#1b1b1b 62%,#0b0b0b 100%);color:#f2ead8;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 7px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.05)}
.sbtn svg.ic{width:21px;height:21px;color:#e8c27a}
.sbtn b{font:600 12.5px/1.15 var(--kai);margin-top:1px}
.sbtn:active,.rbtn:active,.tile:active,.cell:active,.bbtn:active{transform:scale(.94)}
.dot:after{content:"";position:absolute;top:2px;right:3px;width:9px;height:9px;border-radius:50%;background:#e8392b;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
#fieldBar{position:absolute;left:0;right:0;bottom:8px;z-index:3;display:flex;justify-content:center;gap:6px;padding:0 6px;transition:opacity .25s}
.view-med #fieldBar{opacity:0;pointer-events:none}
.bbtn{position:relative;border:none;flex:1;min-width:0;white-space:nowrap;height:34px;padding:0 4px;background:linear-gradient(90deg,rgba(15,15,15,0),rgba(15,15,15,.9) 14%,rgba(15,15,15,.9) 86%,rgba(15,15,15,0));color:#f2ead8;font:600 14px var(--kai);display:flex;align-items:center;gap:3px;justify-content:center}
.bbtn svg.ic{color:#e8c27a}
/* ---- 底部操作区 ---- */
#dock{flex:0 0 auto;background:linear-gradient(#e2ddd2,#d3cdbf);border-top:1px solid #b9ae98;padding:4px 8px 0;position:relative}
#chatStrip{height:26px;display:flex;align-items:center;gap:6px;font-size:12px;color:#3d3a33;overflow:hidden;cursor:pointer}
#chatStrip .tag{flex:0 0 auto;background:#2f6a8a;color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
#chatStrip .bub{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fffaf0;border:1px solid #cbbd9e;border-radius:12px;padding:1px 9px;animation:fadein .4s}
#chatStrip .bub b{color:#2f6a8a;font-weight:600;margin-right:4px}
#ctrl{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 0 2px}
.rbtn{position:relative;width:54px;height:54px;border-radius:50%;border:3px solid #8b7550;background:radial-gradient(circle at 45% 38%,#fbf4e2,#e3d3ad 70%,#cdb98c);color:#3b2b14;font:600 14px/1.1 var(--kai);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.25);padding:0}
.rbtn svg.ic{width:19px;height:19px;color:#6e4f1d}
.rbtn.on{border-color:#c9962e;background:radial-gradient(circle at 45% 38%,#fff6d8,#f0d58d 70%,#d9b45c);box-shadow:0 0 0 2px rgba(201,150,46,.35),0 2px 5px rgba(0,0,0,.25)}
.rbtn small{font:11px var(--kai);color:#6b5a3d}
#bBreak{width:86px;height:58px;border-radius:30px;border:2px solid #c9962e;background:radial-gradient(circle at 45% 35%,#4a4a4a,#151515 70%);color:#ffe2a0;font:600 21px var(--kai);box-shadow:0 3px 8px rgba(0,0,0,.35)}
#bBreak.dim{opacity:.55;color:#d8cfbf;border-color:#777}
#bBreak.hot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,90,.75),0 3px 8px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 9px rgba(255,200,90,0),0 3px 8px rgba(0,0,0,.35)}}
#xp{position:relative;height:20px;margin:4px 0 4px;background:#272727;border-radius:10px;border:2px solid #b89b5e;overflow:hidden}
#xp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#5fd377,#1f8a3a);transition:width .3s}
#xp span{position:absolute;inset:0;text-align:center;color:#fff;font-size:11.5px;line-height:16px;text-shadow:0 1px 1px #000}
#xp em{position:absolute;right:8px;top:0;font-style:normal;color:#ffe27a;font-size:11.5px;line-height:16px}
#nav{position:relative;z-index:35;flex:0 0 auto;display:flex;justify-content:space-around;padding:3px 2px calc(4px + env(safe-area-inset-bottom));background:linear-gradient(#2a2826,#151413);border-top:2px solid #8b7550}
#nav button{position:relative;background:none;border:none;color:#cfc6b3;padding:2px 0;flex:1;display:flex;flex-direction:column;align-items:center;gap:0}
#nav button svg.ic{width:22px;height:22px}
#nav button b{font:600 14px var(--kai);letter-spacing:1px}
#nav button.on{color:#f1c76a}
#nav button.on svg.ic{filter:drop-shadow(0 0 4px rgba(241,199,106,.6))}
#nav button.dot:after{right:22%;top:0}
/* ---- 弹窗卡片 ---- */
#modal{position:absolute;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(20,18,14,.45);opacity:0;pointer-events:none;transition:opacity .2s}
#modal.open{opacity:1;pointer-events:auto}
#modal .card{width:100%;max-height:86%;display:flex;flex-direction:column;background:linear-gradient(#f6efdc,#eadfc3);border:2px solid #8b7550;border-bottom:none;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.35);transform:translateY(30px);transition:transform .22s;position:relative}
#modal.open .card{transform:none}
#modal.center{align-items:center}
#modal.center .card{width:92%;border-radius:16px;border-bottom:2px solid #8b7550;max-height:80%}
.cardHd{flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative;height:44px;background:linear-gradient(90deg,#1c1b19,#3a352d 50%,#1c1b19);border-radius:13px 13px 0 0;color:#f1d38f;font:600 19px var(--kai);letter-spacing:4px;border-bottom:2px solid #c9962e}
.cardHd .bk{position:absolute;left:8px;top:7px;height:30px;border:none;border-radius:15px;background:rgba(255,255,255,.08);color:#e8dcc0;padding:0 10px;font-size:13px;letter-spacing:0}
#mClose{position:absolute;right:8px;top:6px;width:32px;height:32px;border-radius:50%;border:1.5px solid #c9962e;background:#111;color:#f1d38f;font-size:20px;line-height:1;padding:0}
#panel{flex:1 1 auto;overflow-y:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom));color:#3a2e1c;position:relative}
.sec{font:600 15px var(--kai);color:#5a3c12;margin:10px 0 6px;display:flex;align-items:center;gap:6px}
.sec:before{content:"";width:4px;height:15px;background:#b0823a;border-radius:2px}
.sec small{font:12px sans-serif;color:#8a7a60;margin-left:auto}
.muted{color:#8a7a60;font-size:12px}
.box{background:rgba(255,252,243,.75);border:1px solid #d3c29e;border-radius:12px;padding:10px;box-shadow:inset 0 1px 0 #fff}
.row{display:flex;align-items:center;gap:8px}
.grid{display:grid;gap:8px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.btn{border:1px solid #8b7550;background:linear-gradient(#fffaf0,#eadcbc);color:#4a3415;border-radius:18px;padding:6px 14px;font:600 14px var(--kai);box-shadow:0 1px 2px rgba(0,0,0,.15);display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.pri{background:linear-gradient(#3d3a35,#151413);color:#ffe2a0;border-color:#c9962e}
.btn.red{background:linear-gradient(#c8463a,#8f2018);color:#fff3e0;border-color:#6d1810}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:14px}
.btn.wide{width:100%;padding:9px;font-size:16px}
.btn:disabled{opacity:.45;filter:grayscale(.5)}
.btn.dot{position:relative}
.bar{height:8px;background:rgba(60,45,20,.18);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#d9a441,#f2cf7a);border-radius:5px}
.bar.g i{background:linear-gradient(90deg,#3e9a50,#7ad38a)}.bar.b i{background:linear-gradient(90deg,#3a76b8,#7fb4ea)}
.badge{display:inline-block;font-size:11px;line-height:16px;padding:0 6px;border-radius:8px;background:#5a3c12;color:#fbe6b5;white-space:nowrap}
.badge.r{background:#8f2018}.badge.b{background:#2f6a8a}.badge.g{background:#2e7d3a}.badge.p{background:#6b3aa8}.badge.o{background:#b37a12}
/* 属性卡 */
.stat{display:flex;align-items:center;gap:8px;background:rgba(255,252,243,.8);border:1px solid #d6c6a3;border-radius:10px;padding:7px 9px}
.stat .si{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2a2723;color:#f1c76a;flex:0 0 auto}
.stat .si svg.ic{width:17px;height:17px}
.stat .v{font-weight:700;font-size:15px;color:#3a2a10;line-height:1.1}.stat .k{font-size:11.5px;color:#8a7a60}
/* 物品格 */
.cell{position:relative;aspect-ratio:1;border-radius:10px;border:2px solid #9a9a9a;background:radial-gradient(circle at 50% 40%,#fffdf6,#e6dcc6);display:flex;align-items:center;justify-content:center;padding:0;color:#555;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)}
.cell svg.ic{width:58%;height:58%;stroke-width:1.6}
.cell.it svg.ic{width:46%;height:46%;margin-bottom:12px}
.cell .inm{position:absolute;left:2px;right:2px;bottom:3px;font-size:10.5px;line-height:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:-.2px}
.skc{display:flex;gap:9px;align-items:center;border-radius:12px;border:1.5px solid #c2a874;background:rgba(255,252,243,.85);padding:8px;margin-bottom:7px;position:relative}
.skc .sic{width:44px;height:44px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#ffe2a0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.skc .sic svg.ic{width:26px;height:26px}
.skc.lock{filter:grayscale(1);opacity:.55}
.skc .cdb{position:absolute;right:8px;top:7px}
.cell .n{position:absolute;right:3px;bottom:1px;font-size:11px;font-weight:700;color:#3a2a10;text-shadow:0 0 2px #fff,0 0 2px #fff}
.cell .pl{position:absolute;left:3px;top:1px;font-size:10.5px;font-weight:700;color:#b06a00}
.cell .up{position:absolute;right:3px;top:0;font-size:13px;font-weight:900;color:#1f9a3a}
.cell.empty{border-style:dashed;border-color:#b9a88a;background:rgba(255,255,255,.35);color:#b9a88a}
.cell.c0{border-color:#9b9b9b;color:#6b6b6b}.cell.c1{border-color:#3e9a50;color:#2e7d3a;background:radial-gradient(circle at 50% 40%,#fbfff9,#d9ecd6)}.cell.c2{border-color:#3a76b8;color:#2766c4;background:radial-gradient(circle at 50% 40%,#f9fcff,#d4e3f4)}.cell.c3{border-color:#8a3fd1;color:#7d3fc4;background:radial-gradient(circle at 50% 40%,#fdf9ff,#e6d6f4)}.cell.c4{border-color:#d19a1c;color:#b8800f;background:radial-gradient(circle at 50% 40%,#fffdf2,#f5e3b0);box-shadow:0 0 8px rgba(230,170,40,.6)}.cell.c5{border-color:#d23a2a;color:#c0392b;background:radial-gradient(circle at 50% 40%,#fff8f6,#f6d0c8);box-shadow:0 0 9px rgba(220,60,40,.6)}
.cell.cons{border-color:#8b7550;color:#7a5418}
.cell .lab{position:absolute;left:0;right:0;bottom:-17px;font-size:11px;text-align:center;color:#6b5a3d;white-space:nowrap}
/* 人物卡 */
.pcard{position:relative;border-radius:12px;border:1.5px solid #b49866;background:linear-gradient(#fbf6e9,#ecdfc1);overflow:hidden;text-align:center;padding-bottom:6px}
.pcard .ph{height:92px;background:radial-gradient(circle at 50% 60%,#fff,#e2dccd 70%);display:flex;align-items:flex-end;justify-content:center}
.pcard .ph img{height:90px}
.pcard .tt{background:#5a4024;color:#f6d999;font:600 12px var(--kai);padding:2px 0}
.pcard .nm{font:600 15px var(--kai);margin-top:3px}
.pcard .mt{font-size:11.5px;color:#7a6a50}
.pcard.empty{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#a08a66;border-style:dashed;min-height:170px;background:rgba(255,255,255,.35)}
.ava{flex:0 0 auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:600 16px var(--kai);border:2px solid #fff3d6;box-shadow:0 1px 3px rgba(0,0,0,.3)}
/* 列表行 */
.lrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:10px;background:rgba(255,252,243,.75);border:1px solid #dccdab;margin-bottom:6px}
.lrow.me{background:linear-gradient(90deg,#fff2c9,#fbe7ae);border-color:#c9962e}
.lrow .mid{flex:1;min-width:0}.lrow .mid .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .rk{width:28px;text-align:center;font:700 16px var(--kai);color:#7a6a50;flex:0 0 auto}
.lrow .pw{font-weight:700;color:#8f2018;font-size:13px;text-align:right}
/* 弹出详情 */
.pop{position:fixed;inset:0;z-index:40;background:rgba(10,8,5,.45);display:flex;align-items:center;justify-content:center;animation:fadein .15s}
.pop .pc{width:min(84vw,340px);background:linear-gradient(#fbf6e9,#ecdfc1);border:2px solid #8b7550;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden}
.pop .ph{padding:10px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #d3c29e}
.pop .ph .cell{width:58px;flex:0 0 auto}
.pop .pb{padding:10px 12px;font-size:13.5px}
.pop .pf{display:flex;gap:8px;justify-content:center;padding:4px 12px 12px;flex-wrap:wrap}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* 灵宠 */
.cell.pt{flex-direction:column;overflow:hidden}.cell.pt img{width:86%;height:auto;margin-bottom:12px;transform:scaleX(-1)}
.cell.pg0{border-color:#9b9b9b}.cell.pg1{border-color:#3a76b8;background:radial-gradient(circle at 50% 40%,#f9fcff,#d4e3f4)}.cell.pg2{border-color:#d19a1c;background:radial-gradient(circle at 50% 40%,#fffdf2,#f5d98a);box-shadow:0 0 9px rgba(230,170,40,.7)}
.cell .on{position:absolute;left:0;top:0;font-size:10px;line-height:14px;padding:0 4px;border-radius:8px 0 8px 0;background:#8f2018;color:#fff}
.petcard{display:flex;gap:10px;align-items:stretch;border-radius:14px;padding:9px;background:rgba(255,252,243,.9);border:2px solid #9b9b9b}
.petcard.pg1{border-color:#3a76b8;background:linear-gradient(135deg,#f4f9ff,#dce9f7)}.petcard.pg2{border-color:#d19a1c;background:linear-gradient(135deg,#fffaf0,#f6e1a6);box-shadow:0 0 12px rgba(230,170,40,.45)}
.petcard .pp{width:108px;flex:0 0 auto;border-radius:12px;background:radial-gradient(circle at 50% 60%,#fff,#e4dccb 75%);display:flex;align-items:center;justify-content:center;position:relative}
.petcard .pp img{width:100%;transform:scaleX(-1)}
/* 资质：凡体（白）/ 灵体（绿）/ 后天（蓝）/ 先天（橙）/ 混元（红）；深色底保证白字可读 */
.apt{display:inline-block;font:700 10.5px/15px sans-serif;padding:0 4px;border-radius:5px;background:rgba(32,24,16,.86);margin:1px 2px 1px 0;white-space:nowrap;letter-spacing:.3px}
.apt.hy{color:#ff3b30;background:linear-gradient(90deg,#2a0806,#4a0d08);box-shadow:0 0 6px rgba(255,59,48,.85);animation:hyt 1.4s ease-in-out infinite}
@keyframes hyt{50%{box-shadow:0 0 11px rgba(255,120,40,1);color:#ff6a3a}}
.cell.pt .apts{position:absolute;left:0;right:0;bottom:15px;display:flex;justify-content:center;gap:2px;z-index:1}
.cell.pt .apts .apt{font-size:8.5px;line-height:11px;padding:0 2px;border-radius:3px;margin:0;letter-spacing:-.3px}
.cell.pt.wa img{width:74%;margin-bottom:24px}
.ax1{animation:xtg 1.8s ease-in-out infinite}
@keyframes xtg{0%,100%{box-shadow:0 0 4px 1px rgba(255,150,40,.55),inset 0 0 0 2px rgba(255,200,120,.6)}50%{box-shadow:0 0 13px 4px rgba(255,150,40,.95),inset 0 0 0 2px rgba(255,220,150,.9)}}
.ax2{border-color:#e0302a!important;animation:hyg 1.3s ease-in-out infinite}
@keyframes hyg{0%,100%{box-shadow:0 0 6px 2px rgba(255,59,48,.7),0 0 0 1px #ffcf4a,inset 0 0 10px rgba(255,80,40,.35)}50%{box-shadow:0 0 18px 6px rgba(255,90,30,1),0 0 0 2px #ffe08a,inset 0 0 16px rgba(255,170,60,.55)}}
.cell.ax2::after,.petcard .pp.ax2::after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,90,40,.35) 80%,rgba(255,220,120,.45) 85%,transparent 95%);animation:spin 3s linear infinite;pointer-events:none}
.cell.ax1::after,.petcard .pp.ax1::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(255,170,60,.28),transparent 65%);animation:xtp 1.8s ease-in-out infinite;pointer-events:none}
@keyframes xtp{50%{opacity:.35}}
.psk{display:flex;gap:6px;align-items:flex-start;margin-top:5px;font-size:12px;line-height:1.35}.psk b{white-space:nowrap}
.psk .tg{flex:0 0 auto;font-size:10.5px;line-height:16px;padding:0 5px;border-radius:7px;color:#fff;background:#2f6a8a}.psk.ex .tg{background:linear-gradient(90deg,#c8901a,#e8b84a)}
.eggc{text-align:center;border-radius:12px;border:1.5px solid #c2a874;background:rgba(255,252,243,.85);padding:6px 4px}
.eggc svg{width:46px;height:56px;display:block;margin:0 auto}
.eggc .btn{padding:4px 8px;font-size:12px;margin-top:3px}
#eggOv{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 45%,rgba(40,32,20,.75),rgba(5,4,2,.92));display:flex;align-items:center;justify-content:center;flex-direction:column;animation:fadein .2s}
#eggOv .rays{position:absolute;left:50%;top:42%;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;opacity:0;background:repeating-conic-gradient(from 0deg,var(--gc) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 68%);mask:radial-gradient(circle,#000 0,transparent 68%);animation:rays 1s 1.3s forwards,spin 12s linear infinite}
#eggOv .eggw{position:relative;width:130px;height:160px;animation:eshake .9s .1s 2,egone .25s 1.35s forwards}
#eggOv .eggw svg{width:100%;height:100%}
#eggOv .crk{opacity:0;animation:fadein .1s .8s forwards}
#eggOv .flash{position:absolute;left:50%;top:42%;width:40px;height:40px;margin:-20px;border-radius:50%;background:var(--gc);box-shadow:0 0 60px 30px var(--gc);opacity:0;animation:eflash .7s 1.2s forwards}
#eggOv .rev{position:absolute;top:22%;left:0;right:0;text-align:center;opacity:0;transform:scale(.6);animation:erev .5s 1.45s forwards}
#eggOv .rev img{height:150px;transform:scaleX(-1);filter:drop-shadow(0 0 14px var(--gc))}
#eggOv .rev .nm{font:600 28px var(--kai);color:var(--gc);text-shadow:0 0 10px rgba(0,0,0,.6),0 2px 0 #000;letter-spacing:3px}
#eggOv .rev .gr{display:inline-block;margin:4px 0;padding:2px 12px;border-radius:12px;background:var(--gc);color:#fff;font:600 14px var(--kai)}
#eggOv .rev .sk{color:#f2e6c8;font-size:13px;margin:8px auto 0;max-width:300px;line-height:1.5}
#eggOv .rev .tap{color:#a99a7a;font-size:12px;margin-top:14px}
#eggOv.g2 .spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 8px #ffd040;opacity:0;animation:spark 1.6s 1.4s infinite}
@keyframes eshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes egone{to{transform:scale(1.35);opacity:0}}
@keyframes eflash{0%{opacity:0;transform:scale(.2)}35%{opacity:1;transform:scale(3)}100%{opacity:0;transform:scale(6)}}
@keyframes erev{to{opacity:1;transform:none}}
@keyframes rays{to{opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spark{0%{opacity:0;transform:translateY(0) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translateY(-120px) scale(1)}}
/* 吐司 */
#toasts{position:absolute;left:0;right:0;top:78px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{max-width:86%;background:linear-gradient(90deg,rgba(20,18,14,0),rgba(20,18,14,.88) 12%,rgba(20,18,14,.88) 88%,rgba(20,18,14,0));color:#f6e7c4;padding:6px 26px;font-size:13px;text-align:center;animation:tin .25s ease-out,tout .4s ease-in 2.1s forwards}
.enhfx{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:999;pointer-events:none;text-align:center;animation:efin 1.3s ease-out forwards}
.enhfx .ring{position:absolute;left:50%;top:38px;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;animation:ering .8s ease-out forwards}
.enhfx.ok .ring{border:3px solid #ffd76a;box-shadow:0 0 24px #ffcf4a,inset 0 0 18px #ffcf4a}.enhfx.no .ring{border:3px solid #6d6a66}
.enhfx .tx{position:relative;font:700 58px/76px var(--kai);text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.6)}.enhfx.ok .tx{color:#ffd76a}.enhfx.no .tx{color:#c9c2b6;animation:eno .4s}
.enhfx .sub{margin-top:4px;background:rgba(20,18,14,.85);color:#f6e7c4;padding:4px 14px;border-radius:4px;font-size:13px;white-space:nowrap}
@keyframes efin{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
@keyframes ering{from{transform:scale(.3);opacity:1}to{transform:scale(2.2);opacity:0}}
@keyframes eno{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.toast.gain{color:#b9f0a8}.toast.rare{color:#e2b8ff}.toast.warn{color:#ffb4a6}.toast.big{color:#ffe08a;font-weight:600}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
/* 洞府 */
.plot{position:relative;border-radius:12px;border:1.5px solid #9b7d4c;background:linear-gradient(#e9dcc0 0,#e9dcc0 55%,#8a6a42 55%,#6f5232 100%);height:108px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 4px;overflow:hidden}
.plot svg.pl{width:64px;height:64px;position:absolute;left:50%;top:10px;transform:translateX(-50%)}
.plot .tm{position:relative;z-index:1;font-size:11.5px;color:#fff3d6;background:rgba(0,0,0,.4);border-radius:8px;padding:0 6px}
.plot.ripe{box-shadow:0 0 0 2px #f2cf7a,0 0 12px rgba(242,207,122,.8)}
.plot.lock{background:repeating-linear-gradient(45deg,#ddd2bb 0 8px,#d3c6ab 8px 16px);color:#8a7a60;justify-content:center;font-size:12px}
.furnace{display:flex;gap:12px;align-items:center}
.furnace svg{width:86px;height:86px;flex:0 0 auto}
.flame{animation:flick .5s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes flick{from{transform:scaleY(.85)}to{transform:scaleY(1.1)}}
.recipe{border-radius:12px;border:1.5px solid #c2a874;background:rgba(255,252,243,.8);padding:8px;text-align:center}
.recipe .pi{width:40px;height:40px;margin:0 auto 2px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.recipe .pi svg.ic{width:24px;height:24px}
/* 塔 */
.towerv{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0}
.tfl{position:relative;height:30px;display:flex;align-items:center;justify-content:center;color:#f4e6c8;font:600 13px var(--kai);background:linear-gradient(#4b4038,#2a241f);border-left:2px solid #8b7550;border-right:2px solid #8b7550}
.tfl:before{content:"";position:absolute;left:-14px;right:-14px;top:-6px;height:8px;background:linear-gradient(#5a2e22,#2e1712);clip-path:polygon(0 100%,8% 0,92% 0,100% 100%)}
.tfl.cur{background:linear-gradient(#b3812f,#7a5418);color:#fff6dc;box-shadow:0 0 14px rgba(242,190,90,.8)}
.tfl.boss{color:#ff9b8a}
.tfl.top{height:24px}
/* 聊天 */
.cb{display:flex;gap:8px;margin-bottom:9px;align-items:flex-start}
.cb .bb{background:#fffaf0;border:1px solid #d3c29e;border-radius:4px 12px 12px 12px;padding:5px 9px;font-size:13px;max-width:78%}
.cb .who{font-size:11.5px;color:#2f6a8a;margin-bottom:1px}
.cb.sys .bb{background:#efe6d0;color:#6b5a3d}
/* 创建 */
.sectc{display:flex;gap:10px;align-items:center;border-radius:12px;border:1.5px solid #b49866;background:rgba(255,252,243,.8);padding:8px;margin-bottom:8px}
.sectc img{width:60px;height:72px;object-fit:contain;background:radial-gradient(circle,#fff,#e6dcc6);border-radius:10px}
input.tx{background:#fffdf6;color:var(--ink);border:1.5px solid #a88d62;border-radius:18px;padding:7px 14px;font:600 16px var(--kai);width:11em}
textarea{width:100%;min-height:60px;background:#fffdf6;color:var(--ink);border:1px solid var(--pb);border-radius:8px;font:11px monospace}
.seg{display:flex;border:1.5px solid #8b7550;border-radius:16px;overflow:hidden}.seg button{flex:1;border:none;background:#fffaf0;padding:5px 0;font:600 13px sans-serif;color:#5a4024}.seg button.pri{background:#2a2723;color:#ffe2a0}
/* 日志抽屉 */
#drawer{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:45;background:rgba(244,240,231,.98);border-top:3px double var(--pb);display:flex;flex-direction:column;transform:translateY(102%);transition:transform .25s}
#drawer.open{transform:none}
#drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font:600 15px var(--kai);color:#5a3c12}
#drawer .hd button{background:#2a2a2a;color:#fff;border:none;border-radius:6px;padding:3px 10px}
#log{flex:1;overflow-y:auto;padding:2px 10px;font-size:12.5px}
#log div{padding:1px 0;white-space:pre-wrap;word-break:break-all}
#cmdrow{display:flex;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
#cmd{flex:1;background:#fff;color:var(--ink);border:1px solid var(--pb);border-radius:6px;padding:6px;font:inherit}
#cmdrow button{background:#2a2a2a;color:#fff;border:none;border-radius:6px;padding:0 12px}
.sys{color:#7a756b}.gain{color:var(--good)}.rare{color:var(--rare)}.chat{color:var(--chat)}.trib{color:var(--trib)}.warn{color:var(--bad)}.big{color:#8a5a00;font-weight:600}
.q0{color:#555}.q1{color:#2e8b3a}.q2{color:#2766c4}.q3{color:#8a3fd1}.q4{color:#b8800f}.q5{color:#d23a2a}
/* 渡劫全屏 UI 所用的墨点按钮 */
.inkbtn{position:absolute;width:50px;height:50px;border:none;border-radius:47% 53% 45% 55%/55% 45% 53% 47%;background:radial-gradient(circle at 42% 38%,#444 0,#1b1b1b 62%,#0c0c0c 100%);color:#f4f0e6;font:600 16px/1.1 var(--kai);display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:3;padding:0}
.inkbtn.hot{color:#ffd77a;animation:pulse 1.1s ease-in-out infinite}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;display:none;touch-action:none}
#fxui{position:fixed;inset:0;z-index:51;display:none;pointer-events:none}
#fxui .col{position:absolute;right:12px;top:42%;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
#fxui .inkbtn{position:relative}
#fxui .info{position:absolute;left:0;right:0;top:34%;text-align:center;color:#eef4f2;font-size:13px;text-shadow:0 1px 2px #000;pointer-events:none}
#fxui .info b{color:#ffd77a}
.xmimg{display:block;margin:0 auto 4px;filter:drop-shadow(0 0 10px rgba(200,40,90,.8));animation:xmfloat 2.4s ease-in-out infinite}
@keyframes xmfloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.03)}}
#gateArt{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(60,10,40,.75),rgba(0,0,0,.85));color:#ffe9c0;font:600 18px var(--kai);text-align:center;white-space:pre-line;animation:gafade .4s}
#gateArt img{animation:gain .9s cubic-bezier(.2,1.6,.4,1),xmfloat 2.4s ease-in-out .9s infinite;filter:drop-shadow(0 0 18px rgba(255,40,90,.9))}
#gateArt.ok img{animation:gbreak 1.6s forwards}
@keyframes gain{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gbreak{0%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 18px #fff) brightness(1)}60%{transform:scale(1.15);filter:drop-shadow(0 0 40px #fff) brightness(3)}100%{transform:scale(1.4);opacity:0;filter:blur(6px) brightness(4)}}
@keyframes gafade{from{opacity:0}}
.mline{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:6px}.mbar{flex:1;height:7px;border-radius:4px;background:#e6dcc6;overflow:hidden}.mbar i{display:block;height:100%;background:linear-gradient(90deg,#c8902a,#f1c76a)}
.mnode{display:inline-block;padding:1px 6px;margin:2px 3px 0 0;border-radius:8px;font-size:11px;background:#eee4d0;color:#8a7a60}.mnode.on{background:#f1c76a;color:#5a3a10;font-weight:700}
.bondr{padding:5px 8px;margin-bottom:4px;font-size:12px;border-radius:8px;background:#f4ecdc;color:#8a7a60}.bondr.on{background:linear-gradient(90deg,#ffe6a8,#fff3d6);color:#5a3a10;box-shadow:0 0 0 1.5px #e0a83a inset}
#fxui .skip{position:absolute;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:14px;padding:4px 14px}
.scrollbox{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:min(84vw,400px);pointer-events:auto;background:linear-gradient(#f3ead4,#e4d6b6);border:2px solid #8a7048;border-radius:6px;padding:22px 18px 16px;text-align:center;color:#3a2a14;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:unroll .35s ease-out}
.scrollbox:before,.scrollbox:after{content:"";position:absolute;left:-10px;right:-10px;height:12px;background:linear-gradient(#6b4f2a,#3d2c14,#6b4f2a);border-radius:6px}
.scrollbox:before{top:-8px}.scrollbox:after{bottom:-8px}
.scrollbox h4{margin:0 0 8px;font:600 22px var(--kai)}
.scrollbox p{margin:0 0 14px;white-space:pre-line;line-height:1.7}
.scrollbox button{background:radial-gradient(circle at 45% 40%,#444,#111 70%);color:#ffe9b0;border:none;border-radius:16px;padding:6px 26px;font:600 16px var(--kai)}
@keyframes unroll{from{transform:translate(-50%,-50%) scaleY(.1);opacity:0}to{transform:translate(-50%,-50%) scaleY(1);opacity:1}}

/* ==== 画面精修：宣纸纹理、描金框、按压反馈、面板过渡、字体层级 ==== */
:root{--noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .25 0 0 0 0 .15 0 0 0 .11 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");--fiber:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .09' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .36 0 0 0 0 .2 0 0 0 .07 0'/></filter><rect width='100%25' height='100%25' filter='url(%23f)'/></svg>");--mount:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 80' preserveAspectRatio='none'><path d='M0 80V52l18-14 14 8 22-26 18 18 12-8 26 24 16-12 20 14 22-22 16 16 16-10v40z' fill='rgba(90,90,85,.16)'/><path d='M0 80V64l26-10 20 8 30-16 22 14 26-10 30 12 22-8 24 8v18z' fill='rgba(70,70,65,.2)'/></svg>")}
#app{background:var(--noise),var(--fiber),var(--paper)}
#dock{background:var(--noise),linear-gradient(#e6e1d5,#d3cdbf)}
#modal .card{background:var(--noise),var(--fiber),linear-gradient(#f7f0de,#eadfc3);box-shadow:0 -6px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.45),inset 0 0 40px rgba(150,110,50,.12);transition:transform .32s cubic-bezier(.2,.9,.25,1.06),opacity .22s}
#modal:not(.open) .card{opacity:.4}
.cardHd{background:var(--noise),linear-gradient(90deg,#1c1b19,#3a352d 50%,#1c1b19);text-shadow:0 0 8px rgba(241,211,143,.35),0 1px 0 #000;box-shadow:inset 0 -1px 0 rgba(201,150,46,.55),inset 0 -4px 0 rgba(0,0,0,.25)}
.cardHd:before,.cardHd:after{content:"";position:absolute;top:50%;width:22%;height:1px;background:linear-gradient(90deg,rgba(201,150,46,0),rgba(201,150,46,.75));pointer-events:none}
.cardHd:before{left:15%}.cardHd:after{right:15%;transform:scaleX(-1)}
.sec{letter-spacing:1px;position:relative;padding-bottom:3px}
.sec:after{content:"";position:absolute;left:10px;bottom:-1px;width:64px;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(90,60,18,.45),rgba(90,60,18,0))}
.box,.stat,.recipe,.sectc{background-image:var(--noise),linear-gradient(rgba(255,253,246,.85),rgba(250,244,230,.8))}
.stat{box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(80,60,30,.08)}
.stat .si{background:radial-gradient(circle at 40% 35%,#4a4540,#1c1a17 70%);box-shadow:0 0 0 1.5px rgba(201,150,46,.55)}
.btn,.rbtn,#bBreak,.sbtn,.bbtn,.inkbtn,.cell,.tile,#nav button{transition:transform .09s ease-out,box-shadow .12s,filter .12s}
.btn:active{transform:translateY(1px) scale(.97);box-shadow:inset 0 2px 4px rgba(0,0,0,.25);filter:brightness(.96)}
.rbtn:active,#bBreak:active{transform:scale(.93);filter:brightness(.92)}
.sbtn:active,.inkbtn:active{filter:brightness(1.35)}
#nav button:active{transform:translateY(1px)}
#nav button.on:after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:3px;border-radius:2px;background:linear-gradient(90deg,rgba(241,199,106,0),#f1c76a,rgba(241,199,106,0))}
#nav{background:var(--noise),linear-gradient(#2a2826,#151413)}
.sbtn{box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.sbtn b{text-shadow:0 1px 0 #000}
.hero{position:relative;border-radius:14px;border:1.5px solid #c8b58c;background:var(--mount) bottom/100% 46% no-repeat,radial-gradient(circle at 50% 42%,#fffdf8,#ece4d2 68%,#dcd0b6);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),inset 0 0 22px rgba(120,90,40,.18);overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;width:16px;height:16px;border:2px solid #b8862a;pointer-events:none}
.hero:before{left:5px;top:5px;border-right:none;border-bottom:none;border-radius:4px 0 0 0}.hero:after{right:5px;bottom:5px;border-left:none;border-top:none;border-radius:0 0 4px 0}
.hero img{filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
#panel.anim>*{animation:pin .26s ease-out both}
@keyframes pin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{text-shadow:0 1px 1px #000;letter-spacing:.5px}

:root{--paper:#eef6ff;--ink:#35304f;--dim:#8a86a6;--accent:#ff8fb8;--gold:#ffc94a;--sky:#5ab4ff;--pink:#ff7fab;--lav:#a98cff;
--kai:"Hiragino Maru Gothic ProN","Yuanti SC","YouYuan","幼圆","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;

#chatStrip{color:#4a4868}#chatStrip .tag{background:linear-gradient(90deg,#ff8fb8,#ff6f9f);font-weight:700}
#chatStrip .bub{background:#fff;border:1.5px solid #dbe9ff}#chatStrip .bub b{color:#4a8ff0}

</div>

<script>
'use strict';
/* ==================== 配置（所有数值集中于此，均为自定义平衡值，非原作数据） ==================== */
const CFG = {
  saveKey: 'xjcq_mvp_save_v1',
  realms: ['凡人','练气','筑基','金丹','元婴','出窍','分神','合体','大乘','渡劫'],
  maxL: 99,                       // 0..99：10 大境界 × 10 层（1-9 层 + 圆满）
  rateBase: 10, rateGrowth: 1.1,  // 打坐每秒修为 = rateBase × rateGrowth^L
  /* 节奏（真实天数）：最优挂机 = 全天在线/离线连续结算（每 8 小时内上线一次，离线不被截断）、修为丹每日吃满、寻妖丹/聚灵丹不断、队伍有道天宗。
     optDays：设计目标，最优情况下每个大境界所需天数（凡人…渡劫）；凡人→大乘圆满合计约 12 天，渡劫再约 3.5 天。假人天榜也按这张表在真实时间里成长。
     realmSec：每层所需修为 = 打坐速率 × realmSec[大境界] × (1 + layerGrowth × 层)；由 test/timeline.js 的最优策略模拟标定。 */
  pace: { optDays: [0.1, 0.25, 0.5, 0.8, 1.2, 1.6, 2.1, 2.5, 3.0, 3.5] },
  realmSec: [1620, 2569, 6967, 10859, 23591, 32631, 44978, 59199, 62175, 85326], layerGrowth: 0.08,
  expCapMul: 3,                   // 修为最多囤积当前层需求的 3 倍（元婴起一层约 3 小时，3 倍 ≥ 8 小时离线上限）
  offlineCapHours: 8,             // 离线收益上限 8 小时：节奏按“每 8 小时内至少上线一次”计算，此时离线时间全部有效
  speeds: [1, 10, 60, 300, 3600],
  sects: {
    '一剑宗': { desc: '自身攻击 +20%，每 3 回合施展群攻剑诀', selfAtk: 0.2 },
    '道天宗': { desc: '打坐修为 +10%，全队攻击 +20%，会治疗队友；道法共修：全队身法 +15%（多名道天宗不叠加）', med: 0.1, teamAtk: 0.2, teamSpd: 0.15 },
    '魔天宗': { desc: '野外修为 +8%，全队受到伤害 -5%', field: 0.08, teamDR: 0.05 }
  },
  player: { hp: 100, atk: 10, spd: 10, spdPerLv: 1, growth: 1.1 },
  /* 妖兽：同境界“标准单位” = 标准角色（基础属性 + 同级 refQ 品质四件套、强化 +境界层数×refEnh）+ 一只灵品平均资质灵宠（攻 ×refPetAtk、血 ×refPetHp）。
     单只妖兽攻击 = 标准单位 × statMul，气血 = 标准单位 × hpMul（气血更厚，6 只一群也不会被秒），身法 90%；精英（深处）再 +10%。
     每场妖兽数量按大境界 [最少, 最多]，深处最多 +1，上限 6 只 */
  mon: { statMul: 0.55, hpMul: 0.9, refPetAtk: 0.95, refPetHp: 1.04, spdMul: 0.9, refQ: 3, refEnh: 1 / 7, growth: 1.1, eliteMul: 1.1, exp: 84, expLate: 0.0035, lingshi: 6, group: [[1, 2], [1, 3], [2, 3], [2, 4], [2, 4], [3, 5], [3, 5], [4, 6], [4, 6], [4, 6]], groupMax: 6 },
  /* 野外：逐场战斗、逐场结算。每场只模拟一次；时长 = 入场 enterSec + 每个战斗事件的播放秒数（普攻 evSec、宗门技能 skillSec、灵宠主动技 pskillSec、持续伤害 dotSec），与画面回放完全一致；
     回放结束（或画面不可见时逻辑计时到点）才结算这一场。胜：每只妖兽给修为/灵石，按只数掷装备、凡蛋、灵蛋，每场胜利掷一次不老根；败：无收益，调息 lossRest 秒。
     结算后先展示战果 endSec 秒，再寻找下一群妖兽 searchBetween 秒。syncSpeed：调试倍速不超过它时，逻辑会等画面回放播完再结算（画面卡住时 holdMax 真实秒兜底） */
  field: { maxRounds: 20, enterSec: 0.7, evSec: 0.4, skillSec: 0.95, pskillSec: 0.8, dotSec: 0.25, endSec: 2.2, searchMap: 1.5, searchBetween: 1.2, lossRest: 10, syncSpeed: 10, holdMax: 3, dropRate: 0.016, herbRate: 0.005 }, // 逐场结算后每场约 26 秒（原固定 5 秒），每只妖兽的修为/灵石/掉率按场次减少的比例 ×5.4 上调，每天产出不变
  /* 词缀：野外妖兽有几率带 1–2 个词缀（高图更高）；AI 优先集火治疗/自爆；标签显示在名字前 */
  affix: {
    chance: [0.04, 0.06, 0.09, 0.13, 0.18, 0.24, 0.3, 0.36, 0.42, 0.48], dual: 0.15, maxPerPack: 2, healUses: 2,
    loot: { bomb: { ls: 1.0 }, heal: { exp: 0.3 }, other: { exp: 0.08 } }, // 击杀带词缀妖兽的额外奖励（按单只的倍率）
    types: {
      heal:   { name: '治疗型', short: '疗', color: '#3e8a55', heal: 0.16, cd: 2, threat: 100 },
      shield: { name: '护盾型', short: '盾', color: '#2766c4', shield: 0.28, threat: 40 },
      bomb:   { name: '自爆型', short: '爆', color: '#d23a2a', aoe: 0.42, threat: 110 },
      armor:  { name: '坚甲型', short: '甲', color: '#8a7060', dr: 0.32, threat: 35 },
      rage:   { name: '狂暴型', short: '狂', color: '#c85020', atkMul: 0.55, hpTrig: 0.4, threat: 55 },
      swift:  { name: '迅捷型', short: '迅', color: '#5a4bb0', spdMul: 0.38, double: 0.22, threat: 50 }
    }
  },
  /* 大境界渡劫前的心魔守关：玩家+同伴+灵宠打一次；失败进冷却、不额外扣修为；成功后本层可渡劫 */
  gate: {
    cooldown: 900,
    /* hp/atk 相对同境界 monStats(L) 的倍率；skill 为心魔专用招式 */
    bosses: [
      /* hp=×(同境界标准血×2)；atk=×标准攻击；再乘队伍实力^teamExp 与 hpMul/atkMul。目标：平均灵品宠 ~70%，无宠 ~10–25% */
      { name: '心魔·稚念', hp: 2.8, atk: 0.9, skill: 'slash', desc: '凡尘执念凝聚' },
      { name: '心魔·欲焰', hp: 2.6, atk: 0.95, skill: 'burn', desc: '欲火焚心' },
      { name: '心魔·执念', hp: 2.7, atk: 1.0, skill: 'slash', desc: '执而不化' },
      { name: '心魔·贪障', hp: 2.7, atk: 1.05, skill: 'drain', desc: '贪念噬魂' },
      { name: '心魔·嗔魔', hp: 3.5, atk: 1.12, skill: 'nova', desc: '怒气爆发' },
      { name: '心魔·痴障', hp: 3.44, atk: 1.16, skill: 'drain', desc: '痴心不改' },
      { name: '心魔·慢心', hp: 3.6, atk: 1.15, skill: 'armor', desc: '傲视众生' },
      { name: '心魔·疑劫', hp: 4.4, atk: 1.18, skill: 'nova', desc: '疑念成劫' },
      { name: '心魔·天魔', hp: 4.3, atk: 1.22, skill: 'nova', desc: '天魔合身' },
      { name: '心魔·飞升影', hp: 4.2, atk: 1.19, skill: 'nova', desc: '飞升之影' }
    ],
    skills: {
      slash: { name: '魔斩', mul: 1.5, cd: 2 },
      burn:  { name: '欲火', mul: 0.75, aoe: 1, cd: 3, dot: 0.18, dotR: 2 },
      drain: { name: '噬魂', mul: 1.2, cd: 3, heal: 0.025 },
      nova:  { name: '心魔爆发', mul: 0.55, aoe: 1, cd: 3 },
      armor: { name: '铁石心肠', mul: 1.15, cd: 2, selfDR: 0.2, rounds: 2 }
    },
    hpMul: 1.45, atkMul: 1.25, refUnits: 3, teamExp: 0.5, var: 0.3, maxRounds: 30, expSec: 180, tiers: [6, 8], // 心魔立绘阶：<60 紫、60–79 赤、≥80 黑金
  },
  /* v2 功法·经脉：每升 1 层得 1 点经脉点（打坐悟道），分配到攻/血/速三脉；每脉达到节点解锁被动。洗点首次免费，之后花灵石 */
  meridian: {
    ptsPerLevel: 1, respecSec: 1800, // 洗点费用 = 打坐速率 × respecSec 秒对应的灵石（monLingshi × 60）
    lines: {
      atk: { name: '攻脉', icon: 'weapon', per: 0.003, stat: '攻击', nodes: [{ at: 15, name: '剑意', desc: '暴击率 +8%（暴击 ×1.6）', crit: 0.08 }, { at: 40, name: '锋芒', desc: '对精英 / Boss 伤害 +12%', eliteDmg: 0.12 }, { at: 70, name: '破军', desc: '攻击再 +5%', pct: 0.05 }] },
      hp:  { name: '血脉', icon: 'heart', per: 0.004, stat: '气血', nodes: [{ at: 15, name: '护体', desc: '受到伤害 -6%', dr: 0.06 }, { at: 40, name: '回元', desc: '每回合回复 3% 气血', regen: 0.03 }, { at: 70, name: '金身', desc: '气血再 +5%', pct: 0.05 }] },
      spd: { name: '速脉', icon: 'wind', per: 0.0025, stat: '身法', nodes: [{ at: 15, name: '轻身', desc: '闪避率 +5%', dodge: 0.05 }, { at: 40, name: '疾影', desc: '额外行动几率 +6%', extra: 0.06 }, { at: 70, name: '无影', desc: '身法再 +5%', pct: 0.05 }] }
    }
  },
  /* v2 同伴好感：野外胜利 / 赠礼增长；分级解锁同伴被动、合击、渡劫助阵 */
  affinity: {
    perWin: 0.05, levels: [0, 100, 300, 700, 1500], names: ['初识', '相熟', '知己', '莫逆', '生死之交'],

window.XJ = {
  CFG, MAPS, get S() { return S; }, get FB() { return FB; }, SETTLES, fmt, rate, medMult, fieldPause(v) { fbPaused = !!v; }, fieldTick, settleField, startFieldBattle, battleSec, settleText, get BOTS() { return BOTS; }, advance, setView, changeMap, fight, monGroup, buildAllies, rollAffixes, applyAffixStats, mapMul, gateStart, gateBossOf, isGateDone, buildGateBoss, tribRate, gateLook, gateTier, merAdd, merRespec, merFree, merPts, merNodes, affLv, addAff, giftComp, bondOf, myPet, dfUpgrade, dfCost, questAdd, questClaim, merSuggest, merApplySuggest, farmGrowSec, ensureQuest, enhCost, enhance, enhRate, enhMulti, playerStats, addItem, rollGrade, openEgg, openEggUI, dismantleDups, dismantlePet, dismantleEggs, exchangeEgg, petScore, showEggAnim, openPetPop(uid) { pop = { kind: 'pet', uid }; renderPanel(); }, makePet, petStats, petCoef, petFrag, petLook, dupList, isHy, hasXT, aptTier, botPower, botStats, power, charPower, deployPet, watchTrib, PSK, PETSP, needExp, needsTrib, lvName, startGame, exportSave, importSave, save, load, playerRank, rankList, recommendMap, towerStart, changeSect, renameComp, compStats, compPet, autoPets, settleChunk, simManage, hire, mercList, levelSec, optSec, daoGong, get ACC0() { return ACC0; }, tribInvite, tribPill, tribStart, craft, harvestAll, usePill, signin, checkDaily, settleOffline, simWinRate, openPanel, runAction, get actions() { return actions; }, FX, setFx(v) { FXON = v; },
  autoplay(maxSec, stepSec = 30, opt = {}) { // 在线挂机脚本（逐场战斗）：短时段验证用

  },

  },
  /* 整段时间线模拟（离线式期望结算，比逐场快约百倍）：

    const realmAt = {}, st = { lastDay: -1, lastMap: -1e9 }; S.autoBreak = true; S.autoEquip = true;

const ACC0 = () => ({ got: 0, med: 0, field: 0, items: 0, sold: 0, battles: 0, wins: 0, eggF: 0, eggL: 0 });

function simManage(o, st) {
  const casual = !!o.casual, day = Math.floor(S.serverT / 86400);
